name: Validate website release
on:
  pull_request:
  push:
    branches: [main, publish-ready-20261008]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: rev-production-site
          path: dist/
          retention-days: 14
